name: Build Windows source metadata fix app

on:
  push:
    branches: [app-performance]
    paths:
      - app-patches/**
      - .github/workflows/windows-novel-reader.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-novel-illustrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out patch repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: patches
      - name: Check out matching upstream Mangayomi source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kodjodevf/mangayomi
          ref: 34dea5fd450a4b4d7683a32bec31a9ba2f0b555d
          path: app
      - name: Apply illustration changes
        working-directory: app
        run: |
          git apply --check ../patches/app-patches/novel-inline-images.patch
          git apply ../patches/app-patches/novel-inline-images.patch
          git apply --check ../patches/app-patches/traditional-chinese.patch
          git apply ../patches/app-patches/traditional-chinese.patch
          git apply --check --exclude='android/**' ../patches/app-patches/performance.patch
          git apply --exclude='android/**' ../patches/app-patches/performance.patch
          git apply --check ../patches/app-patches/source-list-null-safety.patch
          git apply ../patches/app-patches/source-list-null-safety.patch
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install locked dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Generate complete Traditional Chinese localization
        working-directory: app
        run: flutter gen-l10n
      - name: Analyze Traditional Chinese UI changes
        working-directory: app
        shell: pwsh
        run: |
          $targets = Get-Content ../patches/app-patches/traditional-chinese-files.txt
          dart analyze @targets
      - name: Analyze background library and sync code
        working-directory: app
        shell: pwsh
        run: |
          $targets = Get-Content ../patches/app-patches/performance-files.txt
          dart analyze @targets
      - name: Analyze legacy source metadata fix
        working-directory: app
        shell: pwsh
        run: |
          $targets = Get-Content ../patches/app-patches/source-list-files.txt
          dart analyze @targets
      - name: Analyze changed reader code
        working-directory: app
        run: dart analyze lib/modules/novel/widgets/novel_illustration.dart lib/modules/novel/novel_reader_view.dart lib/modules/novel/utils/novel_paginator.dart test/modules/novel_illustration_test.dart test/modules/novel_inline_html_test.dart
      - name: Test real database background work and large sync payloads
        working-directory: app
        run: flutter test --no-pub test/modules/browse/source_metadata_test.dart test/services/database_worker_test.dart test/services/library_chapter_summary_test.dart test/services/sync_background_transport_test.dart test/services/sync_checkpoint_test.dart test/modules/library/library_unread_sort_test.dart test/repositories/manga_repository_test.dart test/modules/more/data_and_storage/restore_replace_test.dart test/settings/settings_clobber_test.dart
      - name: Test inline illustrations and existing pagination
        working-directory: app
        run: flutter test --no-pub test/modules/novel_illustration_test.dart test/modules/novel_inline_html_test.dart test/modules/novel_double_page_test.dart test/modules/novel_ref_after_dispose_test.dart test/l10n/traditional_chinese_test.dart test/l10n/episode_count_test.dart
      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release --no-pub --build-number=131
      - name: Package test app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item patches/app-patches/README.md app/build/windows/x64/runner/Release/ILLUSTRATIONS-README.md
          Copy-Item patches/app-patches/PERFORMANCE.md app/build/windows/x64/runner/Release/PERFORMANCE-README.md
          Copy-Item app/LICENSE app/build/windows/x64/runner/Release/LICENSE.Mangayomi.txt
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath dist/Mangayomi-0.9.9-source-fix-windows.zip
          Get-FileHash dist/Mangayomi-0.9.9-source-fix-windows.zip -Algorithm SHA256 | Format-List
      - name: Upload Windows test app
        uses: actions/upload-artifact@v4
        with:
          name: Mangayomi-0.9.9-source-fix-windows
          path: dist/Mangayomi-0.9.9-source-fix-windows.zip
          if-no-files-found: error
          retention-days: 14
